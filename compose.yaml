services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yonro
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: yonro
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - yonro_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yonro -d yonro']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  yonro_pg:
